<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MathSimAI+ Pecutan SPM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam-hall sprint — USM band, countdown hero, tabbed workspace; papers render as real 3472 answer sheets */
:root{
  --bg:#EEF1F6; --sheet:#FFFFFF; --ink:#16213A; --muted:#5A6580; --line:#D5DBE7; --soft:#F5F7FB;
  --usm:#4B2A85; --usm-soft:rgba(75,42,133,.10); --sprint:#E8590C; --sprint-soft:rgba(232,89,12,.12);
  --ok:#1E8A52; --ok-soft:rgba(30,138,82,.12); --bad:#C8323F; --bad-soft:rgba(200,50,63,.10); --warn:#B7791F; --warn-soft:rgba(183,121,31,.14);
  --c1:#2F6FDE; --c2:#0E9F8F; --c3:#D9480F; --grid:rgba(22,33,58,.06);
  --f-disp:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-exam:"STIX Two Text","Times New Roman",Times,serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --sheet:#161D30; --ink:#E6EAF4; --muted:#9AA5BF; --line:#2A3450; --soft:#1B2338;
  --usm:#B79CFF; --usm-soft:rgba(183,156,255,.14); --sprint:#FF8A47; --sprint-soft:rgba(255,138,71,.16);
  --ok:#5BD08F; --ok-soft:rgba(91,208,143,.14); --bad:#FF7A85; --bad-soft:rgba(255,122,133,.12); --warn:#F2C14E; --warn-soft:rgba(242,193,78,.14);
  --c1:#7FA8FF; --c2:#4FD6C4; --c3:#FF9B5E; --grid:rgba(230,234,244,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322; --sheet:#161D30; --ink:#E6EAF4; --muted:#9AA5BF; --line:#2A3450; --soft:#1B2338;
  --usm:#B79CFF; --usm-soft:rgba(183,156,255,.14); --sprint:#FF8A47; --sprint-soft:rgba(255,138,71,.16);
  --ok:#5BD08F; --ok-soft:rgba(91,208,143,.14); --bad:#FF7A85; --bad-soft:rgba(255,122,133,.12); --warn:#F2C14E; --warn-soft:rgba(242,193,78,.14);
  --c1:#7FA8FF; --c2:#4FD6C4; --c3:#FF9B5E; --grid:rgba(230,234,244,.06); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
p,li,.just{text-align:justify;hyphens:auto}
h1,h2,h3,h4{font-family:var(--f-disp);line-height:1.15;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sprint);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* USM band */
.band{background:#FFFFFF;border-bottom:4px solid var(--sprint)}
.band .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.band img{display:block;height:50px;width:auto}
.band .who{margin-left:auto;text-align:right;color:#3A1D6E;font-size:13px;font-weight:700;line-height:1.35}
.band .who span{display:block;font-weight:400;color:#5A4F6B}
@media (max-width:600px){.band img{height:36px}.band .who{font-size:11.5px}.band .who span{display:none}}
/* hero */
.hero{background:linear-gradient(135deg,#1B1240 0%,#2E1A63 55%,#5B2A6E 100%);color:#F3F0FF;position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;padding-block:26px 22px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#FFB48A}
.hero h1{font-size:clamp(32px,5.2vw,56px);font-weight:800;letter-spacing:-.02em;margin-top:6px}
.hero h1 b{color:#FF8A47}
.hero h1 small{display:block;font-size:.42em;font-weight:500;letter-spacing:0;color:#D9D0FF;margin-top:6px}
.hero p{color:#DCD5F5;max-width:60ch;margin:12px 0 0}
.byline{font-size:14px;color:#F3F0FF;margin-top:14px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.25);text-align:left}
.clock{background:rgba(10,6,30,.45);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.clock h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#FFB48A}
.digits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.digits div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 4px;text-align:center}
.digits b{display:block;font-family:var(--f-mono);font-size:clamp(22px,4vw,34px);line-height:1.1;color:#FFFFFF}
.digits span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#CFC6F2}
.digits b.tick{animation:tick .5s ease}
@keyframes tick{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.track{position:relative;height:30px}
.track .rail{position:absolute;left:0;right:0;top:14px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.track .done{position:absolute;left:0;top:14px;height:4px;border-radius:4px;background:linear-gradient(90deg,#FFB48A,#FF5A1F)}
.track .runner{position:absolute;top:4px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#FF5A1F;box-shadow:0 0 0 6px rgba(255,90,31,.25);animation:glow 1.6s ease-in-out infinite}
.track .flag{position:absolute;right:-2px;top:-2px;font-size:11px;color:#FFB48A;font-weight:700}
@keyframes glow{50%{box-shadow:0 0 0 12px rgba(255,90,31,.05)}}
.clock small{color:#CFC6F2;font-size:12.5px;text-align:justify;display:block}
.lang{display:flex;gap:4px}
.lang button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:#fff;color:#2E1A63}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:0 0 auto;padding:13px 14px;font-weight:700;font-size:14.5px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sprint)}
.tabs a small{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
main{padding-block:20px 50px}
.view{display:grid;gap:16px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.sh p{margin:0;color:var(--muted);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:17px;margin-bottom:8px}
.lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.sp{background:var(--sprint-soft);color:var(--sprint);border-color:transparent}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:var(--ink);color:var(--sheet);font-size:14px}
.btn.sp{background:var(--sprint);color:#fff}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* gauge + format */
.gauge{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.gauge svg{width:150px;height:150px}
.gauge .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.bigG{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1}
.fmt{display:grid;gap:10px}
.fbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.fbar div{display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.fbar div:nth-child(2){animation-delay:.15s}.fbar div:nth-child(3){animation-delay:.3s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.tbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--k)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.j{text-align:justify}
th{font-family:var(--f-disp);font-size:12.5px;letter-spacing:.04em;color:var(--muted);background:var(--soft)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.sl{display:grid;gap:4px}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.sl output{font-family:var(--f-mono);color:var(--sprint)}
input[type=range]{width:100%;accent-color:var(--sprint)}
.plan{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--sheet)}
.plan li.now{border-color:var(--sprint);background:var(--sprint-soft)}
.plan li.past{opacity:.6}
.plan .d{font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--muted)}
.plan li.now .d{color:var(--sprint)}
.plan b{display:block;font-family:var(--f-disp);font-size:15px}
.plan p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hc{border-radius:10px;padding:9px 10px;border:1px solid var(--line);background:var(--sheet);display:grid;gap:4px;min-width:0;position:relative;overflow:hidden}
.hc .t{font-size:13px;font-weight:700;line-height:1.25}
.hc .m{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.hc .fill{position:absolute;left:0;bottom:0;height:4px;transition:width 1s}
.tips{display:grid;gap:8px;margin:0;padding-left:20px}
/* exam sheet */
.examhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.cover{border:2px solid var(--ink);border-radius:4px;padding:14px 16px;background:var(--sheet);font-family:var(--f-exam);display:grid;gap:4px}
.cover .code{font-family:var(--f-mono);font-weight:700;font-size:14px}
.cover h2{font-family:var(--f-exam);font-size:24px;font-weight:600;letter-spacing:.02em}
.cover .sub{font-size:15.5px}
.arahan{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:12px 16px}
.arahan summary{cursor:pointer;font-weight:700}
.arahan ol{margin:8px 0 0;padding-left:22px;display:grid;gap:4px;font-size:14.5px}
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:15;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.timerbar .tt{font-family:var(--f-mono);font-size:24px;font-weight:700}
.timerbar .tt.low{color:var(--bad)}
.qnav{display:flex;flex-wrap:wrap;gap:5px}
.qnav a{display:grid;place-items:center;width:32px;height:30px;border-radius:7px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-family:var(--f-mono);font-size:13px;font-weight:700;background:var(--sheet)}
.qnav a.p{background:var(--warn-soft);border-color:var(--warn)}
.qnav a.f{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qnav a.x{opacity:.45}
.qnav i{width:1px;background:var(--line);margin:0 4px}
.secHead{background:var(--ink);color:var(--sheet);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;font-family:var(--f-exam)}
.secHead b{font-family:var(--f-disp);font-size:17px;letter-spacing:.04em}
.secHead span{font-size:15px}
.paper{background:var(--sheet);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--line),0 8px 20px rgba(0,0,0,.04);padding:18px 20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;scroll-margin-top:200px}
.paper.off{opacity:.55}
.qno{font-family:var(--f-exam);font-weight:600;font-size:20px}
.qbody{min-width:0;display:grid;gap:10px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.stem{font-family:var(--f-exam);font-size:18px;line-height:1.55;text-align:justify}
.stem i,.part i{font-style:italic}
.stem .en,.part .en{display:block;font-style:italic;color:var(--muted);font-size:15.5px}
.fig{border:1px dashed var(--line);border-radius:8px;padding:8px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;max-width:520px;width:100%;justify-self:center}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);text-align:center;font-family:var(--f-exam);margin-top:4px}
.part{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 8px;padding-top:10px;border-top:1px dotted var(--line)}
.part .pl{font-family:var(--f-exam);font-size:17px}
.part .pt{font-family:var(--f-exam);font-size:17px;line-height:1.5;text-align:justify}
.mk{float:right;font-family:var(--f-exam);font-size:15px;margin-left:10px;white-space:nowrap}
.ansrow{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ansrow input{width:150px;border:1px solid var(--line);border-bottom:2px solid var(--ink);background:var(--soft);border-radius:6px 6px 0 0;padding:7px 10px;font-family:var(--f-mono)}
.ansrow .u{font-size:14px;color:var(--muted)}
.fb{font-weight:700;font-size:14px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--warn)}
.skema{grid-column:2;border-left:3px solid var(--usm);background:var(--usm-soft);border-radius:0 8px 8px 0;padding:8px 12px;font-size:14.5px}
.skema ol{margin:4px 0 0;padding-left:20px;display:grid;gap:3px}
.skema li{font-family:var(--f-mono);font-size:13.5px;text-align:left}
.skema li em{font-style:normal;font-weight:700;color:var(--usm);margin-left:6px}
.choose{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--soft)}
.choose input{accent-color:var(--sprint);width:16px;height:16px}
.result{border:2px solid var(--sprint);border-radius:14px;padding:16px;background:var(--sheet);display:grid;gap:10px}
.itab{width:100%;font-family:var(--f-exam);font-size:15.5px}
.itab td,.itab th{border:1px solid var(--line);text-align:center}
/* animations in figures */
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
.draw.d2{animation-delay:.6s}.draw.d3{animation-delay:1.2s}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35;transform:scale(1.35)}}
.fadein{animation:fade 1s .8s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sweep{transform-box:fill-box;transform-origin:left;animation:grow 1.6s .4s cubic-bezier(.2,.8,.2,1) both}
/* simulator */
.simtabs{display:flex;flex-wrap:wrap;gap:6px}
.simtabs button{border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px}
.simtabs button[aria-pressed="true"]{background:var(--usm);border-color:var(--usm);color:var(--sheet)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 300px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage{min-width:0;position:relative;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.stage canvas{display:block;width:100%;height:100%;min-height:440px}
.ctrl{border-left:1px solid var(--line);padding:14px;display:grid;gap:12px;align-content:start;min-width:0}
.readout{font-family:var(--f-mono);font-size:13px;display:grid;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px}
.readout div{display:flex;justify-content:space-between;gap:8px}
.readout b{color:var(--sprint)}
.simnote{font-size:14px;color:var(--muted);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 8px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center;background:var(--sheet)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.info{display:grid;gap:14px}
.ihead{background:linear-gradient(120deg,#2E1A63,#5B2A6E);color:#F3F0FF;border-radius:14px;padding:18px 20px;display:grid;gap:6px}
.ihead .lbl{color:#FFB48A}.ihead h2{font-size:clamp(24px,3.6vw,34px);font-weight:800}
.bigidea{margin:0;font-size:17px;line-height:1.55;color:#EDE8FF}.bigidea b{color:#FFC9A8}
.remember{background:var(--warn-soft);border-color:var(--warn);position:relative}
.remember h3{color:var(--warn)}.remember ol{margin:0;padding-left:22px;display:grid;gap:10px}
.remember li{font-size:15px}.remember b{background:linear-gradient(transparent 55%,var(--sprint-soft) 55%)}
.trapc{background:var(--bad-soft);border-color:transparent}.trapc h3{color:var(--bad)}.trapc ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.fxg{display:grid;gap:8px}
.fx{border:1px solid var(--line);border-left:4px solid var(--usm);border-radius:8px;padding:8px 12px;display:grid;gap:2px;background:var(--soft)}
.fx .eq{font-family:var(--f-exam);font-size:18px;font-weight:600;color:var(--usm);overflow-x:auto}
.fx .d{font-size:13.5px;color:var(--muted)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:f}
.flow li{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;padding:10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);animation:fade .6s both;text-align:left}
.flow li b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sprint);color:#fff;font-family:var(--f-disp)}
.flow li span{font-weight:700;font-size:14.5px}
.player{display:grid;gap:10px}
.screen{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.screen canvas{display:block;width:100%;height:400px}
.cap{background:#1E1440;color:#fff;padding:10px 14px;font-size:15px;line-height:1.45;text-align:justify;min-height:3.4em}
.scn{position:absolute;top:10px;right:12px;font-family:var(--f-mono);font-size:12px;background:var(--sprint);color:#fff;border-radius:6px;padding:2px 8px}
.pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{position:relative;flex:1;min-width:140px;height:10px;border-radius:5px;background:var(--soft);border:1px solid var(--line);cursor:pointer}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--sprint);border-radius:5px}
.prog b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.4}
a.hc:hover{border-color:var(--sprint)}
@media (max-width:560px){.screen canvas{height:300px}.cap{font-size:13px;padding:8px 10px}.bigidea{font-size:15.5px}}
.qhint{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:14.5px}.qhint summary{cursor:pointer;font-weight:700;color:var(--warn)}.qhint ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.setbar{border-color:var(--sprint)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.acard{display:grid;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 14px;min-width:0}
.acard:hover{border-color:var(--sprint)}.acard[aria-pressed="true"]{border-color:var(--usm);box-shadow:inset 4px 0 0 var(--usm)}
.acard .ai{font-size:26px;line-height:1}.acard .at{font-family:var(--f-disp);font-weight:700;font-size:16px;line-height:1.25}.acard .af{font-size:12.5px;color:var(--muted)}
.tchip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--usm-soft);color:var(--usm);white-space:nowrap}
.ihead .tchip.lt{background:rgba(255,255,255,.14);color:#fff;text-decoration:none}
.btn:disabled{cursor:not-allowed}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--sheet)}
footer .wrap{padding-block:16px;display:grid;gap:6px}
footer p{margin:0}
@media (max-width:920px){
  .hero .wrap{grid-template-columns:1fr}
  .s4,.s5,.s6,.s7,.s8{grid-column:span 12}
  .sim{grid-template-columns:1fr}.ctrl{border-left:0;border-top:1px solid var(--line)}
  .stage canvas{height:340px;min-height:0}
  .examhead{grid-template-columns:1fr}
}
@media (max-width:560px){
  .paper{grid-template-columns:1fr;padding:14px}
  .ansrow,.skema{grid-column:1/-1}
  .part{grid-template-columns:26px minmax(0,1fr)}
  .gauge{grid-template-columns:1fr;justify-items:center}
  .stage canvas{height:290px;min-height:0}
  .plan li{grid-template-columns:1fr}
  .stem{font-size:17px}
  .timerbar .tt{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style>

</head>

/* ---------- math helpers ---------- */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;const tt=1/(1+p*x);return s*(1-(((((a5*tt+a4)*tt)+a3)*tt+a2)*tt+a1)*tt*Math.exp(-x*x));}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const fmtN=(x,d=3)=>{if(!isFinite(x))return '—';const r=Math.round(x*10**d)/10**d;return String(r);};
function parseAns(v){v=String(v).trim().replace(/,/g,'.').replace(/\s/g,'').replace(/−/g,'-');if(!v)return NaN;
 const m=v.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return Number(m[1])/Number(m[2]);return Number(v);}

/* ---------- SVG figure kit ---------- */
let CID=0;
function plot(o){
 const Wd=o.w||420,Ht=o.h||260,P=o.pad||30,[x0,x1]=o.x,[y0,y1]=o.y;
 const X=x=>P+(x-x0)/(x1-x0)*(Wd-2*P),Y=y=>Ht-P-(y-y0)/(y1-y0)*(Ht-2*P);
 const id='cp'+(++CID);
 let s=`<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${o.alt||'graph'}"><defs><clipPath id="${id}"><rect x="${P}" y="${P-4}" width="${Wd-2*P}" height="${Ht-2*P+8}"/></clipPath><marker id="ar${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker></defs>`;
 const ax=Math.min(Math.max(0,x0),x1),ay=Math.min(Math.max(0,y0),y1);
 s+=`<line x1="${P-6}" y1="${Y(ay)}" x2="${Wd-P+10}" y2="${Y(ay)}" style="stroke:var(--ink)" stroke-width="1.2" marker-end="url(#ar${id})"/>`;
 s+=`<line x1="${X(ax)}" y1="${Ht-P+6}" x2="${X(ax)}" y2="${P-12}" style="stroke:var(--ink)" stroke-width="1.2" marker-end="url(#ar${id})"/>`;
 s+=`<text x="${Wd-P+4}" y="${Y(ay)+16}" font-size="13" font-style="italic" style="fill:var(--ink);font-family:var(--f-exam)">${o.xl||'x'}</text><text x="${X(ax)+6}" y="${P-6}" font-size="13" font-style="italic" style="fill:var(--ink);font-family:var(--f-exam)">${o.yl||'y'}</text>`;
 if(o.origin!==false&&x0<=0&&y0<=0)s+=`<text x="${X(0)-12}" y="${Y(0)+14}" font-size="12" style="fill:var(--ink);font-family:var(--f-exam)">O</text>`;
 (o.ticks||[]).forEach(k=>{const[v,lab,axis]=k;if(axis==='y')s+=`<line x1="${X(ax)-4}" x2="${X(ax)+4}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--ink)"/><text x="${X(ax)-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${lab}</text>`;else s+=`<line y1="${Y(ay)-4}" y2="${Y(ay)+4}" x1="${X(v)}" x2="${X(v)}" style="stroke:var(--ink)"/><text x="${X(v)}" y="${Y(ay)+16}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${lab}</text>`;});
 const path=(f,a=x0,b=x1,N=160)=>{let d='';for(let i=0;i<=N;i++){const x=a+(b-a)*i/N,y=f(x);d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);}return d;};
 (o.shade||[]).forEach(sh=>{let d=`M${X(sh.a)} ${Y(sh.g?sh.g(sh.a):0)}`;const N=80;for(let i=0;i<=N;i++){const x=sh.a+(sh.b-sh.a)*i/N;d+=`L${X(x).toFixed(1)} ${Y(sh.f(x)).toFixed(1)}`;}for(let i=N;i>=0;i--){const x=sh.a+(sh.b-sh.a)*i/N;d+=`L${X(x).toFixed(1)} ${Y(sh.g?sh.g(x):0).toFixed(1)}`;}s+=`<path class="fadein" d="${d}Z" clip-path="url(#${id})" style="fill:${sh.c||'var(--sprint)'};fill-opacity:.22"/>`;});
 (o.poly||[]).forEach(pg=>{s+=`<path class="fadein" d="M${pg.pts.map(p=>X(p[0])+' '+Y(p[1])).join('L')}Z" style="fill:${pg.c||'var(--c2)'};fill-opacity:.2;stroke:${pg.c||'var(--c2)'}"/>`;});
 (o.segs||[]).forEach((g,i)=>{s+=`<line class="draw d${(i%3)+1}" pathLength="1" x1="${X(g[0])}" y1="${Y(g[1])}" x2="${X(g[2])}" y2="${Y(g[3])}" style="stroke:${g[4]||'var(--muted)'}" stroke-width="${g[6]||1.6}" ${g[5]?'stroke-dasharray="5 4"':''}/>`;});
 (o.curves||[]).forEach((c,i)=>{const d=path(c.f,c.a??x0,c.b??x1);s+=`<g clip-path="url(#${id})"><path class="${c.dash?'':'draw'}" pathLength="1" d="${d}" fill="none" style="stroke:${c.c||'var(--c1)'}" stroke-width="${c.w||2.6}" ${c.dash?'stroke-dasharray="6 5"':''}/></g>`;
   if(c.tracer)s+=`<circle r="6" style="fill:var(--sprint)"><animateMotion dur="${c.tracer}s" repeatCount="indefinite" path="${d}"/></circle>`;
   if(c.lab)s+=`<text x="${X(c.lab[0])}" y="${Y(c.lab[1])}" font-size="12" style="fill:${c.c||'var(--c1)'};font-family:var(--f-exam);font-style:italic">${c.lab[2]}</text>`;});
 (o.pts||[]).forEach(p=>{s+=`<circle class="${p.pulse?'pulse':''}" cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||4.5}" style="fill:${p.c||'var(--ink)'}"/>`;if(p.l)s+=`<text x="${X(p.x)+(p.dx??7)}" y="${Y(p.y)+(p.dy??-7)}" font-size="13" style="fill:var(--ink);font-family:var(--f-exam)">${p.l}</text>`;});
 (o.txt||[]).forEach(q=>{s+=`<text x="${X(q[0])}" y="${Y(q[1])}" font-size="${q[3]||12}" style="fill:${q[4]||'var(--muted)'};font-family:var(--f-exam)">${q[2]}</text>`;});
 s+=(o.extra?`<g clip-path="url(#${id})">${o.extra(X,Y)}</g>`:'')+'</svg>';
 return s;
}
function sectorSVG(r,th,seg,lab){ // centre at left-bottom area, angle from x-axis
 const Wd=360,Ht=240,cx=60,cy=200,R=150;
 const ax=cx+R,ay=cy,bx=cx+R*Math.cos(th),by=cy-R*Math.sin(th);
 const arc=`M${ax} ${ay} A${R} ${R} 0 0 0 ${bx.toFixed(1)} ${by.toFixed(1)}`;
 let s=`<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="sector">`;
 s+=`<path class="fadein" d="M${cx} ${cy} L${ax} ${ay} ${arc.slice(arc.indexOf('A'))} Z" style="fill:var(--c1);fill-opacity:${seg?.08:.18}"/>`;
 if(seg)s+=`<path class="fadein" d="M${ax} ${ay} ${arc.slice(arc.indexOf('A'))} Z" style="fill:var(--sprint);fill-opacity:.35"/><line class="draw d2" pathLength="1" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" style="stroke:var(--sprint)" stroke-width="2"/>`;
 s+=`<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" style="stroke:var(--ink)" stroke-width="2"/><line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" style="stroke:var(--ink)" stroke-width="2"/>`;
 s+=`<path class="draw" pathLength="1" d="${arc}" fill="none" style="stroke:var(--c1)" stroke-width="3"/>`;
 s+=`<path d="M${cx+34} ${cy} A34 34 0 0 0 ${cx+34*Math.cos(th)} ${cy-34*Math.sin(th)}" fill="none" style="stroke:var(--sprint)" stroke-width="1.6"/>`;
 s+=`<text x="${cx+40}" y="${cy-12}" font-size="13" style="fill:var(--sprint);font-family:var(--f-exam)">${lab.th}</text>`;
 s+=`<text x="${cx-16}" y="${cy+16}" font-size="14" style="fill:var(--ink);font-family:var(--f-exam);font-style:italic">O</text><text x="${ax+6}" y="${ay+4}" font-size="14" style="fill:var(--ink);font-family:var(--f-exam);font-style:italic">A</text><text x="${bx-4}" y="${by-8}" font-size="14" style="fill:var(--ink);font-family:var(--f-exam);font-style:italic">B</text>`;
 s+=`<text x="${cx+R/2-8}" y="${cy+18}" font-size="13" style="fill:var(--ink);font-family:var(--f-exam)">${lab.r}</text>`;
 s+=`<circle r="5" style="fill:var(--sprint)"><animateMotion dur="3s" repeatCount="indefinite" path="${arc}"/></circle></svg>`;
 return s;
}
function triSVG(A,B,C,labs,angLab){ // points in px
 let s=`<svg viewBox="0 0 380 240" role="img" aria-label="triangle"><path class="fadein" d="M${A}L${B}L${C}Z" style="fill:var(--c2);fill-opacity:.12"/>`;
 s+=`<path class="draw" pathLength="1" d="M${A}L${B}L${C}Z" fill="none" style="stroke:var(--ink)" stroke-width="2.2"/>`;
 labs.forEach(l=>s+=`<text x="${l[0]}" y="${l[1]}" font-size="${l[3]||14}" style="fill:${l[4]||'var(--ink)'};font-family:var(--f-exam);${l[5]?'font-style:italic':''}">${l[2]}</text>`);
 return s+(angLab||'')+'</svg>';
}

/* figure helpers used by the bank */
function apFig(a,d,p,q){const v=Array.from({length:Math.max(q,8)},(_,i)=>a+i*d),mx=Math.max(...v);let s=`<svg viewBox="0 0 420 200" role="img" aria-label="AP terms">`;const w=Math.min(46,400/v.length);v.forEach((y,i)=>{const h=y/mx*150,x=14+i*w,hl=i===p-1||i===q-1;s+=`<rect x="${x}" y="${170-h}" width="${w-10}" height="${h}" rx="3" style="fill:${hl?'var(--sprint)':'var(--c1)'};fill-opacity:${hl?.9:.35};transform-box:fill-box;transform-origin:bottom;animation:grow 1s ${i*.08}s both"/><text x="${x+(w-10)/2}" y="188" text-anchor="middle" font-size="11" style="fill:var(--muted);font-family:var(--f-exam)">T${i+1}</text>`;if(hl)s+=`<text x="${x+(w-10)/2}" y="${164-h}" text-anchor="middle" font-size="12" style="fill:var(--ink);font-family:var(--f-exam)">${y}</text>`;});return s+'</svg>';}
function coordFig(x1,y1,x2,y2,Rx,Ry,ratio,L=['P','Q','R']){const xs=[x1,x2,0],ys=[y1,y2,0];return plot({x:[Math.min(...xs)-1,Math.max(...xs)+2],y:[Math.min(...ys)-1,Math.max(...ys)+2],segs:[[x1,y1,x2,y2,'var(--c1)',0,2.6]],pts:[{x:x1,y:y1,l:L[0]},{x:x2,y:y2,l:L[1],dx:-20},{x:Rx,y:Ry,l:L[2],pulse:1,c:'var(--sprint)'}],txt:[[(x1+Rx)/2+.6,(y1+Ry)/2-.3,ratio,12,'var(--sprint)']]});}
function vecFig(a,b,c,d,L=['A','B']){return plot({x:[Math.min(0,c)-1,Math.max(a,c)+1.5],y:[Math.min(0,d)-1.5,Math.max(b,d)+1],segs:[[0,0,a,b,'var(--c1)',0,2.6],[0,0,c,d,'var(--c2)',0,2.6],[a,b,c,d,'var(--sprint)',1,2]],pts:[{x:a,y:b,l:L[0]},{x:c,y:d,l:L[1]}]});}
function cubicFig(f,a,b,lab){let lo=Infinity,hi=-Infinity;for(let i=0;i<=60;i++){const x=a-1.3+(b-a+2.6)*i/60;lo=Math.min(lo,f(x));hi=Math.max(hi,f(x));}return plot({x:[Math.min(-.4,a-1.3),b+1.3],y:[Math.min(-1,lo-1),hi+1],curves:[{f,tracer:5}],pts:[{x:a,y:f(a),pulse:1,c:'var(--c2)'},{x:b,y:f(b),pulse:1,c:'var(--sprint)'}]});}
function lettersFig(w){let s=`<svg viewBox="0 0 420 110" role="img" aria-label="letters ${w}">`;const n=w.length,sz=Math.min(54,380/n-8);w.split('').forEach((c,i)=>{const v='AEIOU'.includes(c),x=(420-n*(sz+8))/2+i*(sz+8);s+=`<g class="${v?'pulse':''}"><rect x="${x}" y="22" width="${sz}" height="60" rx="8" style="fill:${v?'var(--sprint-soft)':'var(--soft)'};stroke:${v?'var(--sprint)':'var(--line)'}"/><text x="${x+sz/2}" y="62" text-anchor="middle" font-size="24" style="fill:var(--ink);font-family:var(--f-exam)">${c}</text></g>`;});return s+'<text x="210" y="102" text-anchor="middle" font-size="12" style="fill:var(--muted)">vokal / vowels ditanda / highlighted</text></svg>';}
function binomFig(n,p,r){let s='<svg viewBox="0 0 420 210" role="img" aria-label="binomial">';const w=Math.min(44,390/(n+1));let mx=0;for(let k=0;k<=n;k++)mx=Math.max(mx,nCr(n,k)*p**k*(1-p)**(n-k));for(let k=0;k<=n;k++){const pr=nCr(n,k)*p**k*(1-p)**(n-k),h=pr/mx*150,x=14+k*w;s+=`<rect x="${x}" y="${180-h}" width="${w-8}" height="${h}" rx="3" style="fill:${k===r?'var(--sprint)':'var(--c1)'};fill-opacity:${k===r?.9:.4};transform-box:fill-box;transform-origin:bottom;animation:grow 1s ${k*.06}s both"/><text x="${x+(w-8)/2}" y="198" text-anchor="middle" font-size="11" style="fill:var(--muted);font-family:var(--f-exam)">${k}</text>`;}return s+`<text x="250" y="26" font-size="13" style="fill:var(--ink);font-family:var(--f-exam)">X ~ B(${n}, ${p})</text></svg>`;}
function lcFig(t,A,Bc,c,pts){const r=Math.sqrt(t),L=r+1.2;return plot({w:320,h:320,x:[-L,L],y:[-L,L],curves:[{f:x=>Math.sqrt(Math.max(0,t-x*x)),a:-r,b:r},{f:x=>-Math.sqrt(Math.max(0,t-x*x)),a:-r,b:r},{f:x=>(c-A*x)/Bc,c:'var(--c2)'}],pts:pts.map(p=>({x:p[0],y:p[1],pulse:1,c:'var(--sprint)'}))});}
function bounceFig(a,r){let d='M20 180',x=20,h=150;for(let i=0;i<7;i++){const w=60*Math.sqrt(h/150);d+=` Q${x+w/2} ${180-2*h} ${x+w} 180`;x+=w;h*=(r==='½'?.5:+r);}return `<svg viewBox="0 0 420 200" role="img" aria-label="decaying motion"><line x1="10" y1="180" x2="410" y2="180" style="stroke:var(--ink)"/><path class="draw" pathLength="1" d="${d}" fill="none" style="stroke:var(--c1)" stroke-width="2"/><circle r="9" style="fill:var(--sprint)"><animateMotion dur="5s" repeatCount="indefinite" path="${d}"/></circle><text x="30" y="34" font-size="13" style="fill:var(--ink);font-family:var(--f-exam)">a = ${a} cm, r = ${r}</text></svg>`;}

/* build a paper for a set id: S1 = original fixed set, S2/S3 = fixed seeded trials, R<n> = random */
const SETSEED={S1:1,S2:2026002,S3:2026003};
function buildPaper(p,set){const base=set.startsWith('R')?+set.slice(1):SETSEED[set];const fixed=set==='S1';
 return BANK.filter(b=>b.p===p).map(b=>{const R=RR((base^hashS(b.id))>>>0,fixed);const vi=R.v(b.v.length);const o=b.v[vi](R);return Object.assign({id:b.id,p:b.p,s:b.s,n:b.n,ch:b.ch,set,vi,key:set+'_'+b.id},o);});}

let QS=[];function rebuild(){QS=[...buildPaper(1,S.set[1]),...buildPaper(2,S.set[2])];}
const setName=x=>x.startsWith('R')?(S.lang==='bm'?'Set Rawak #':'Random Set #')+x.slice(1):(S.lang==='bm'?'Set Pecutan ':'Sprint Set ')+x.slice(1);
const chKey=(p,s)=>S.set[p]+':'+p+s;
const qByKey=k=>QS.find(x=>x.key===k.slice(0,k.lastIndexOf('-')));

/* ---------- scoring ---------- */
const pid=(q,i)=>q.key+'-'+i;
const A=k=>{const a=S.ans[k]||(S.ans[k]={v:'',ok:false,tries:0,rev:false,earned:0});if(!a.ch){const q=qByKey(k);if(q){a.ch=q.ch;a.m=q.parts[+k.slice(k.lastIndexOf('-')+1)].m;}}return a;};
const qEarned=q=>q.parts.reduce((n,p,i)=>n+(S.ans[pid(q,i)]?.earned||0),0);
const qMax=q=>q.parts.reduce((n,p)=>n+p.m,0);
function secScore(p,s){const qs=QS.filter(q=>q.p===p&&q.s===s),need=PAPERS[p].secs[s].need;
 if(need==='all')return{got:qs.reduce((n,q)=>n+qEarned(q),0),max:PAPERS[p].secs[s].max};
 const ch=(S.choose[chKey(p,s)]||[]);let use=ch.length===need?qs.filter(q=>ch.includes(q.id)):[...qs].sort((a,b)=>qEarned(b)-qEarned(a)).slice(0,need);
 return{got:use.reduce((n,q)=>n+qEarned(q),0),max:PAPERS[p].secs[s].max};}
function paperScore(p){let got=0,max=0;const secs={};Object.keys(PAPERS[p].secs).forEach(s=>{const r=secScore(p,s);secs[s]=r;got+=r.got;max+=r.max;});return{got,max,secs};}
function chapStats(){const m={};Object.keys(CH).forEach(k=>m[k]={tried:0,earned:0,max:0});Object.values(S.ans).forEach(a=>{if(a.ch&&m[a.ch]&&(a.tries>0||a.rev)){const c=m[a.ch];c.tried++;c.earned+=a.earned||0;c.max+=a.m||0;}});return m;}

const ez=p=>p<.5?2*p*p:1-(-2*p+2)**2/2;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function big(ctx,s,x,y,col,size=20,align='left'){ctx.fillStyle=col||css('--ink');ctx.font=`600 ${size}px "STIX Two Text",serif`;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left';}
function arrowL(ctx,x1,y1,x2,y2,col){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a-.4),y2-12*Math.sin(a-.4));ctx.lineTo(x2-12*Math.cos(a+.4),y2-12*Math.sin(a+.4));ctx.fill();}
function box(ctx,x,y,w,h,col,txt,sub){ctx.fillStyle=col;ctx.globalAlpha=.14;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);big(ctx,txt,x+w/2,y+h/2+4,css('--ink'),Math.min(22,w/6),'center');if(sub){ctx.font='13px "Atkinson Hyperlegible",sans-serif';ctx.fillStyle=css('--muted');ctx.textAlign='center';ctx.fillText(sub,x+w/2,y+h-10);ctx.textAlign='left';}}
const VIDS={
 diff:{t:{bm:"Daripada sekan kepada tangen",en:"From secant to tangent"},sc:[
  {d:6,c:{bm:"Kecerunan garis sekan PQ ialah Δy/Δx. Titik Q berada jauh daripada P.",en:"The gradient of secant PQ is Δy/Δx. Point Q starts far from P."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,3.4,-1,10]);const f=x=>x*x;curve(ctx,G.X,G.Y,f,-.5,3.2,css('--c1'));const hh=2.2-.6*ez(p),q=1+hh,m=(f(q)-1)/hh;curve(ctx,G.X,G.Y,x=>1+m*(x-1),-.5,3.4,css('--sprint'),2,2);dot(ctx,G.X(1),G.Y(1),css('--ink'));dot(ctx,G.X(q),G.Y(f(q)),css('--sprint'));label(ctx,'P(1, 1)',G.X(1)+8,G.Y(1)+18);label(ctx,'Q',G.X(q)+8,G.Y(f(q)));big(ctx,'m = '+m.toFixed(2),40,40,css('--sprint'),22);}},
  {d:6,c:{bm:"Apabila Q menghampiri P (Δx → 0), garis sekan berpusing menjadi tangen. Kecerunan menghampiri 2.",en:"As Q approaches P (Δx → 0) the secant turns into the tangent. The gradient approaches 2."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,3.4,-1,10]);const f=x=>x*x;curve(ctx,G.X,G.Y,f,-.5,3.2,css('--c1'));const hh=1.6*(1-ez(p))+.001,q=1+hh,m=(f(q)-1)/hh;curve(ctx,G.X,G.Y,x=>1+m*(x-1),-.5,3.4,css('--sprint'),2,2);dot(ctx,G.X(1),G.Y(1),css('--ink'));dot(ctx,G.X(q),G.Y(f(q)),css('--sprint'));big(ctx,'Δx = '+hh.toFixed(3),40,40,css('--muted'),18);big(ctx,'m = '+m.toFixed(3),40,68,css('--sprint'),22);if(p>.85)big(ctx,'dy/dx = 2x = 2',40,98,css('--ok'),22);}},
  {d:7,c:{bm:"Gerakkan tangen di sepanjang lengkung. Pada titik maksimum dan minimum, tangen mendatar: dy/dx = 0.",en:"Slide the tangent along the curve. At the maximum and minimum it is horizontal: dy/dx = 0."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,4.5,-1,8.5]);const f=x=>x**3-6*x*x+9*x+2,d=x=>3*x*x-12*x+9;curve(ctx,G.X,G.Y,f,-.4,4.4,css('--c1'));const x=-.2+4.4*p,m=d(x);curve(ctx,G.X,G.Y,t=>f(x)+m*(t-x),x-.8,x+.8,css('--sprint'),3,2);dot(ctx,G.X(x),G.Y(f(x)),css('--sprint'),7);[1,3].forEach(k=>{if(Math.abs(x-k)<.25){dot(ctx,G.X(k),G.Y(f(k)),css('--ok'),10);}});big(ctx,'dy/dx = '+m.toFixed(2),40,40,m>0.05?css('--ok'):m<-0.05?css('--bad'):css('--sprint'),22);}},
  {d:6,c:{bm:"Uji terbitan kedua: d²y/dx² positif → minimum (senyum ∪). Negatif → maksimum (masam ∩).",en:"Second-derivative test: positive → minimum (smile ∪). Negative → maximum (frown ∩)."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,4.5,-1,8.5]);const f=x=>x**3-6*x*x+9*x+2;curve(ctx,G.X,G.Y,f,-.4,4.4,css('--c1'));const a=cl(p*2);ctx.globalAlpha=a;dot(ctx,G.X(1),G.Y(6),css('--bad'),9);big(ctx,'∩  d²y/dx² = −6 < 0 → maks',G.X(1)-30,G.Y(6)-18,css('--bad'),17);ctx.globalAlpha=cl(p*2-1);dot(ctx,G.X(3),G.Y(2),css('--ok'),9);big(ctx,'∪  d²y/dx² = 6 > 0 → min',G.X(3)-120,G.Y(2)+34,css('--ok'),17);ctx.globalAlpha=1;}}]},
 integ:{t:{bm:"Luas, songsangan dan isi padu",en:"Area, reverse and volume"},sc:[
  {d:7,c:{bm:"Anggarkan luas di bawah y = 4 − x² dengan segi empat tepat. Tambah bilangan segi empat, n.",en:"Estimate the area under y = 4 − x² with rectangles. Increase the number of rectangles, n."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,2.6,-.5,4.6]);const f=x=>4-x*x,n=Math.max(2,Math.round(2+38*ez(p)));let R=0;const dx=2/n;for(let i=0;i<n;i++){const y=f(dx*(i+.5));R+=y*dx;ctx.fillStyle=css('--sprint-soft');ctx.strokeStyle=css('--sprint');ctx.lineWidth=1;ctx.fillRect(G.X(dx*i),G.Y(y),G.X(dx)-G.X(0),G.Y(0)-G.Y(y));ctx.strokeRect(G.X(dx*i),G.Y(y),G.X(dx)-G.X(0),G.Y(0)-G.Y(y));}curve(ctx,G.X,G.Y,f,-.5,2.1,css('--c1'));big(ctx,`n = ${n}   jumlah ≈ ${R.toFixed(4)}`,G.X(.9),40,css('--ink'),20);}},
  {d:5,c:{bm:"Apabila n → ∞, jumlah menjadi kamiran tentu: ∫₀² (4 − x²) dx = 16/3 ≈ 5.333.",en:"As n → ∞ the sum becomes the definite integral: ∫₀² (4 − x²) dx = 16/3 ≈ 5.333."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,2.6,-.5,4.6]);const f=x=>4-x*x,b=2*ez(p);ctx.fillStyle=css('--sprint-soft');ctx.beginPath();ctx.moveTo(G.X(0),G.Y(0));for(let i=0;i<=80;i++){const x=b*i/80;ctx.lineTo(G.X(x),G.Y(f(x)));}ctx.lineTo(G.X(b),G.Y(0));ctx.fill();curve(ctx,G.X,G.Y,f,-.5,2.1,css('--c1'));const A=4*b-b**3/3;big(ctx,`∫₀^${b.toFixed(2)} = ${A.toFixed(3)}`,G.X(.9),40,css('--sprint'),22);}},
  {d:6,c:{bm:"Kamiran membalikkan pembezaan. Bezakan x³/3 dapat x²; kamirkan x² dapat x³/3 + c.",en:"Integration reverses differentiation. Differentiate x³/3 to get x²; integrate x² to get x³/3 + c."},f(ctx,w,h,p,tt){const bw=Math.min(220,w*.32),y=h/2-40;box(ctx,30,y,bw,80,css('--c1'),'x³/3 + c','fungsi asal');box(ctx,w-30-bw,y,bw,80,css('--sprint'),'x²','terbitan');const up=Math.sin(tt*2)>0;arrowL(ctx,30+bw+10,y+20,w-40-bw,y+20,up?css('--c1'):css('--line'));arrowL(ctx,w-40-bw,y+60,30+bw+10,y+60,up?css('--line'):css('--sprint'));big(ctx,'d/dx',w/2,y+10,css('--c1'),18,'center');big(ctx,'∫ dx',w/2,y+95,css('--sprint'),18,'center');}},
  {d:7,c:{bm:"Isi padu kisaran: kepingan nipis menjadi cakera bulat. Setiap cakera ialah π y² δx, jadi V = π ∫ y² dx.",en:"Volume of revolution: each thin slice becomes a disc π y² δx, so V = π ∫ y² dx."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-.5,2.6,-4.6,4.6]);const f=x=>4-x*x;curve(ctx,G.X,G.Y,f,0,2,css('--c1'));curve(ctx,G.X,G.Y,x=>-f(x),0,2,css('--c1'),1.5);const n=Math.round(12*ez(p));for(let i=0;i<n;i++){const x=(i+.5)*2/12,y=f(x);ctx.strokeStyle=css('--sprint');ctx.fillStyle=css('--sprint-soft');ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(G.X(x),G.Y(0),8,G.Y(0)-G.Y(y),0,0,2*pi);ctx.fill();ctx.stroke();}big(ctx,'V = π∫₀² (4 − x²)² dx = 256π/15',G.X(.3),34,css('--sprint'),19);}}]},
 trig:{t:{bm:"Bulatan unit melukis graf",en:"The unit circle draws the graph"},sc:[
  {d:7,c:{bm:"Titik berputar pada bulatan unit. Ketinggiannya ialah sin θ, dan bayangnya melukis graf sinus.",en:"A point turns on the unit circle. Its height is sin θ, and its shadow draws the sine graph."},f(ctx,w,h,p){const R=Math.min(80,h/4),cx=R+30,cy=h/2;ctx.strokeStyle=css('--line');ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,2*pi);ctx.stroke();const th=2*pi*p,ux=cx+R*Math.cos(th),uy=cy-R*Math.sin(th);ctx.strokeStyle=css('--ink');ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ux,uy);ctx.stroke();dot(ctx,ux,uy,css('--sprint'));const x0=cx+R+40,W2=w-x0-20,X=t=>x0+t/(2*pi)*W2;ctx.strokeStyle=css('--ink');ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x0+W2,cy);ctx.stroke();ctx.strokeStyle=css('--c1');ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=200;i++){const t=th*i/200;i?ctx.lineTo(X(t),cy-R*Math.sin(t)):ctx.moveTo(X(t),cy-R*Math.sin(t));}ctx.stroke();ctx.setLineDash([4,4]);ctx.strokeStyle=css('--sprint');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ux,uy);ctx.lineTo(X(th),uy);ctx.stroke();ctx.setLineDash([]);dot(ctx,X(th),uy,css('--sprint'));big(ctx,'θ = '+(th*180/pi).toFixed(0)+'°   sin θ = '+Math.sin(th).toFixed(2),x0,40,css('--ink'),18);}},
  {d:6,c:{bm:"Kos θ ialah koordinat-x titik yang sama. Graf kos bermula di puncak.",en:"Cos θ is the x-coordinate of the same point. The cosine graph starts at its peak."},f(ctx,w,h,p){const R=Math.min(80,h/4),cx=R+30,cy=h/2;ctx.strokeStyle=css('--line');ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,2*pi);ctx.stroke();const th=2*pi*p,ux=cx+R*Math.cos(th),uy=cy-R*Math.sin(th);dot(ctx,ux,uy,css('--c2'));ctx.strokeStyle=css('--c2');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ux,cy);ctx.stroke();const x0=cx+R+40,W2=w-x0-20,X=t=>x0+t/(2*pi)*W2;ctx.strokeStyle=css('--ink');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x0+W2,cy);ctx.stroke();ctx.strokeStyle=css('--c2');ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=200;i++){const t=th*i/200;i?ctx.lineTo(X(t),cy-R*Math.cos(t)):ctx.moveTo(X(t),cy-R*Math.cos(t));}ctx.stroke();dot(ctx,X(th),cy-R*Math.cos(th),css('--c2'));big(ctx,'kos θ = '+Math.cos(th).toFixed(2),x0,40,css('--c2'),18);}},
  {d:6,c:{bm:"Fungsi positif mengikut sukuan: Semua, Sin, Tan, Kos. Ingat \"Add Sugar To Coffee\".",en:"Positive functions by quadrant: All, Sin, Tan, Cos. Remember \"Add Sugar To Coffee\"."},f(ctx,w,h,p){const R=Math.min(130,h/2-30),cx=w/2,cy=h/2;const lab=[['A','Semua / All',1,-1],['S','sin',-1,-1],['T','tan',-1,1],['C','kos / cos',1,1]];const q=Math.min(3,Math.floor(p*4));lab.forEach((l,i)=>{ctx.fillStyle=i===q?css('--sprint-soft'):'transparent';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,-(i+1)*pi/2,-i*pi/2);ctx.closePath();ctx.fill();big(ctx,l[0],cx+l[2]*R*.5,cy+l[3]*R*.45,i===q?css('--sprint'):css('--muted'),40,'center');big(ctx,l[1],cx+l[2]*R*.5,cy+l[3]*R*.45+26,css('--ink'),15,'center');});ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,2*pi);ctx.moveTo(cx-R-10,cy);ctx.lineTo(cx+R+10,cy);ctx.moveTo(cx,cy-R-10);ctx.lineTo(cx,cy+R+10);ctx.stroke();}},
  {d:7,c:{bm:"Selesaikan 3 kos 2x = 1.5: lukis garis y = 1.5. Setiap titik silang ialah satu penyelesaian. Ada 4.",en:"Solve 3 cos 2x = 1.5: draw y = 1.5. Each crossing is one solution. There are 4."},f(ctx,w,h,p){const G=view2(ctx,w,h,[0,2*pi,-3.6,3.6],{sx:pi/2,sy:1,fx:x=>['0','π/2','π','3π/2','2π'][Math.round(x/(pi/2))]||''});curve(ctx,G.X,G.Y,x=>3*Math.cos(2*x),0,2*pi*cl(p*1.6),css('--c1'));ctx.setLineDash([7,5]);curve(ctx,G.X,G.Y,()=>1.5,0,2*pi,css('--sprint'),2,2);ctx.setLineDash([]);[pi/6,5*pi/6,7*pi/6,11*pi/6].forEach((x,i)=>{if(p>.55+i*.1){dot(ctx,G.X(x),G.Y(1.5),css('--sprint'),8);big(ctx,String(i+1),G.X(x)-4,G.Y(1.5)-14,css('--sprint'),16);}});}}]},
 prob:{t:{bm:"Daripada bar binomial ke lengkung normal",en:"From binomial bars to the normal curve"},sc:[
  {d:6,c:{bm:"Taburan binomial B(20, 0.5): setiap bar ialah P(X = r). Bar paling tinggi berhampiran min np = 10.",en:"Binomial B(20, 0.5): each bar is P(X = r). The tallest bars sit near the mean np = 10."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-1,21,0,.2],{sx:2,sy:.05});let c=1;for(let r=0;r<=20;r++){if(r)c=c*(21-r)/r;const pr=c/2**20*cl(p*1.5-r*.02);ctx.fillStyle=css('--c1');ctx.globalAlpha=.55;ctx.fillRect(G.X(r-.4),G.Y(pr),G.X(.8)-G.X(0),G.Y(0)-G.Y(pr));ctx.globalAlpha=1;}}},
  {d:6,c:{bm:"Apabila n besar, puncak bar membentuk lengkung loceng. Itulah taburan normal.",en:"For large n the bar tops trace a bell curve. That is the normal distribution."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-1,21,0,.2],{sx:2,sy:.05});let c=1;for(let r=0;r<=20;r++){if(r)c=c*(21-r)/r;const pr=c/2**20;ctx.fillStyle=css('--c1');ctx.globalAlpha=.3;ctx.fillRect(G.X(r-.4),G.Y(pr),G.X(.8)-G.X(0),G.Y(0)-G.Y(pr));ctx.globalAlpha=1;}const s=Math.sqrt(5);curve(ctx,G.X,G.Y,x=>Math.exp(-(((x-10)/s)**2)/2)/(s*Math.sqrt(2*pi)),-1,-1+22*ez(p),css('--sprint'),3);}},
  {d:7,c:{bm:"Piawaikan: Z = (X − μ)/σ. Lengkung dianjak ke 0 dan dilebarkan supaya σ = 1. Semua soalan normal guna satu jadual sahaja.",en:"Standardise: Z = (X − μ)/σ. The curve shifts to 0 and rescales so σ = 1. Every normal question then uses one table."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-4,8,0,.45],{sx:1,sy:.1});const e=ez(p),mu=4*(1-e),sg=1.8*(1-e)+e;curve(ctx,G.X,G.Y,x=>Math.exp(-(((x-mu)/sg)**2)/2)/(sg*Math.sqrt(2*pi)),-4,8,css('--c1'));ctx.setLineDash([5,4]);ctx.strokeStyle=css('--muted');ctx.beginPath();ctx.moveTo(G.X(mu),G.Y(0));ctx.lineTo(G.X(mu),G.Y(.42));ctx.stroke();ctx.setLineDash([]);big(ctx,`μ = ${mu.toFixed(2)}   σ = ${sg.toFixed(2)}`,G.X(2),36,css('--ink'),19);if(p>.9)big(ctx,'Z ~ N(0, 1)',G.X(2),62,css('--ok'),20);}},
  {d:6,c:{bm:"Kebarangkalian ialah luas di bawah lengkung. P(Z > 1) = 0.1587, iaitu ekor kanan selepas z = 1.",en:"Probability is area under the curve. P(Z > 1) = 0.1587, the right tail beyond z = 1."},f(ctx,w,h,p){const G=view2(ctx,w,h,[-4,4,0,.45],{sx:1,sy:.1});const f=x=>Math.exp(-x*x/2)/Math.sqrt(2*pi),b=1+3*ez(p);ctx.fillStyle=css('--sprint-soft');ctx.beginPath();ctx.moveTo(G.X(1),G.Y(0));for(let i=0;i<=80;i++){const x=1+(b-1)*i/80;ctx.lineTo(G.X(x),G.Y(f(x)));}ctx.lineTo(G.X(b),G.Y(0));ctx.fill();curve(ctx,G.X,G.Y,f,-4,4,css('--c1'));big(ctx,'P(1 < Z < '+b.toFixed(2)+') = '+(Phi(b)-Phi(1)).toFixed(4),G.X(-3.6),40,css('--sprint'),19);}}]},
 kin:{t:{bm:"Sesaran, halaju, pecutan",en:"Displacement, velocity, acceleration"},sc:[
  {d:6,c:{bm:"Tiga kuantiti, satu rantai: bezakan untuk turun daripada s ke v ke a, kamirkan untuk naik semula.",en:"Three quantities, one chain: differentiate down from s to v to a, integrate back up."},f(ctx,w,h,p,tt){const bw=Math.min(170,(w-120)/3),y=h/2-40,xs=[30,w/2-bw/2,w-30-bw];box(ctx,xs[0],y,bw,80,css('--c1'),'s','sesaran');box(ctx,xs[1],y,bw,80,css('--c2'),'v','halaju');box(ctx,xs[2],y,bw,80,css('--c3'),'a','pecutan');const k=Math.floor(tt*1.2)%4;arrowL(ctx,xs[0]+bw+6,y+25,xs[1]-6,y+25,k===0?css('--sprint'):css('--line'));arrowL(ctx,xs[1]+bw+6,y+25,xs[2]-6,y+25,k===1?css('--sprint'):css('--line'));arrowL(ctx,xs[2]-6,y+60,xs[1]+bw+6,y+60,k===2?css('--ok'):css('--line'));arrowL(ctx,xs[1]-6,y+60,xs[0]+bw+6,y+60,k===3?css('--ok'):css('--line'));big(ctx,'d/dt',w/2,y-14,css('--sprint'),18,'center');big(ctx,'∫ dt',w/2,y+112,css('--ok'),18,'center');}},
  {d:7,c:{bm:"v = 10 + 3t − t². Selagi v positif, zarah bergerak ke kanan menjauhi O.",en:"v = 10 + 3t − t². While v is positive the particle moves right, away from O."},f(ctx,w,h,p){return kinScene(ctx,w,h,5*p);}},

function kinScene(ctx,w,h,t){const V=x=>10+3*x-x*x,S=x=>10*x+1.5*x*x-x**3/3;const top=80,LX=s=>40+s/50*(w-80);ctx.fillStyle=css('--soft');ctx.fillRect(10,10,w-20,top-16);ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,top-30);ctx.lineTo(w-20,top-30);ctx.stroke();big(ctx,'O',LX(0)-6,top-10,css('--ink'),15);dot(ctx,LX(S(t)),top-30,css('--sprint'),10);const v=V(t);arrowL(ctx,LX(S(t)),top-52,LX(S(t))+v*4+(v>=0?1:-1),top-52,v>=0?css('--ok'):css('--bad'));
 ctx.save();ctx.translate(0,top);const G=view2(ctx,w,h-top,[0,6.3,-9,14]);curve(ctx,G.X,G.Y,V,0,6,css('--c1'),2);curve(ctx,G.X,G.Y,V,0,t,css('--sprint'),4);dot(ctx,G.X(t),G.Y(v),css('--sprint'),7);if(t>=4.95){dot(ctx,G.X(5),G.Y(0),css('--ok'),9);label(ctx,'v = 0',G.X(5)+8,G.Y(0)-10,css('--ok'));}ctx.restore();big(ctx,`t = ${t.toFixed(2)} s   v = ${v.toFixed(2)} m/s   s = ${S(t).toFixed(2)} m`,24,top+26,css('--ink'),16);}
function lpFill(ctx,G,pts,a,col){ctx.globalAlpha=.22*a;ctx.fillStyle=col;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(G.X(p[0]),G.Y(p[1])):ctx.moveTo(G.X(p[0]),G.Y(p[1])));ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
function triDraw(ctx,w,h,p,mode){const s=Math.min(32,(w-80)/12),A=[60,h-50],B=[60+10*s,h-50],C=[60+6*s,h-50-6.5*s];ctx.fillStyle=css('--soft');ctx.strokeStyle=css('--ink');ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.lineTo(...C);ctx.closePath();ctx.fill();ctx.stroke();big(ctx,'A',A[0]-20,A[1]+6);big(ctx,'B',B[0]+8,B[1]+6);big(ctx,'C',C[0]-6,C[1]-10);
 const hl=(P,Q,col)=>{ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(...P);ctx.lineTo(...Q);ctx.stroke();};const ang=(P,a0,a1,col)=>{ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(P[0],P[1],28,a0,a1);ctx.stroke();};
 if(mode==='sin'){if(p>.1){hl(B,C,css('--sprint'));ang(A,-0.83,0,css('--sprint'));}if(p>.55){hl(A,C,css('--c1'));ang(B,pi,pi+0.96,css('--c1'));}big(ctx,'a / sin A = b / sin B',w-300,60,css('--ink'),22);}

function ambig(ctx,w,h,p,tt,final){const s=Math.min(30,(w-60)/16),A=[40,h-60],ang=35*pi/180,C=[A[0]+10*s*Math.cos(ang),A[1]-10*s*Math.sin(ang)];ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(w-20,A[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...C);ctx.stroke();big(ctx,'A',A[0]-18,A[1]+6);big(ctx,'C',C[0]-6,C[1]-10);big(ctx,'35°',A[0]+36,A[1]-8,css('--sprint'),15);
 ctx.setLineDash([4,5]);ctx.strokeStyle=css('--line');ctx.beginPath();ctx.arc(C[0],C[1],7*s,0,pi);ctx.stroke();ctx.setLineDash([]);
 const dy=A[1]-C[1],dx=Math.sqrt((7*s)**2-dy*dy),B1=[C[0]-dx,A[1]],B2=[C[0]+dx,A[1]];

function startPlayer(key){if(!key)return;const V=VIDS[key],cv=$('#vcv');if(!cv)return;const ctx=cv.getContext('2d');const tot=V.sc.reduce((n,s)=>n+s.d,0);
 player={V,tot,t:0,play:true,last:performance.now(),scene:-1,raf:0};
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)player.play=false;
 function frame(now){const P=player;if(!P)return;const dt=(now-P.last)/1000;P.last=now;if(P.play){P.t+=dt;if(P.t>=tot){P.t=tot-.001;P.play=false;}}
  let acc=0,i=0;for(;i<V.sc.length-1;i++){if(P.t<acc+V.sc[i].d)break;acc+=V.sc[i].d;}const sc=V.sc[i],p=cl((P.t-acc)/sc.d);
  const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(cv.width!==Math.round(r.width*d)||cv.height!==Math.round(r.height*d)){cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);}
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);try{sc.f(ctx,r.width,r.height,p,now/1000);}catch(e){console.error("scene",e.message)}
  if(i!==P.scene){P.scene=i;$('#vcap').textContent=L(sc.c);$('#vscn').textContent=`${i+1} / ${V.sc.length}`;if($('#vvoice')?.checked)speak(L(sc.c));}
  $('#vfill').style.width=(P.t/tot*100)+'%';$('#vtime').textContent=`${Math.floor(P.t/60)}:${String(Math.floor(P.t%60)).padStart(2,'0')} / ${Math.floor(tot/60)}:${String(Math.round(tot%60)).padStart(2,'0')}`;$('#vplay').textContent=P.play?'❚❚':'▶';
  P.raf=requestAnimationFrame(frame);}
 player.raf=requestAnimationFrame(frame);

document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-lang]');if(lb){S.lang=lb.dataset.lang;save();$('#digits').innerHTML='';countdown();render();return;}
 const jm=e.target.closest('[data-jump]');if(jm){e.preventDefault();document.getElementById(jm.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return;}

 const gs=e.target.closest('[data-gosim]');if(gs){e.preventDefault();S.sim=gs.dataset.gosim;save();location.hash='simulator';return;}

 const sg=e.target.closest('[data-seg]');if(sg){simSeg[curSim]=+sg.dataset.seg;document.querySelectorAll('[data-seg]').forEach(b=>b.setAttribute('aria-pressed',b===sg));return;}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
 if(act==='chk')check(b.dataset.k);
 else if(act==='sk'){const k=b.dataset.k,a=A(k);if(!a.tries)return;a.rev=!a.rev;if(a.rev&&!a.ok)a.peeked=true;save();refreshQ(qByKey(k));}
 else if(act==='tm'){const p=+b.dataset.p;S.tm[p].run=!S.tm[p].run;b.textContent=S.tm[p].run?t('pause'):t('start');save();}
 else if(act==='tmr'){const p=+b.dataset.p;S.tm[p]={left:PAPERS[p].dur,run:false};save();$('#tt-'+p).textContent=fmtT(PAPERS[p].dur);$('#tp-'+p).style.width='0%';$('#tb-'+p).textContent=t('start');}
 else if(act==='submit')submit(+b.dataset.p);
 else if(act==='appchk'||act==='appsk'){const k=APPS[S.app]?S.app:'bridge',C=APPS[k].ch;S.appAns=S.appAns||{};const a=S.appAns[k]||(S.appAns[k]={v:'',tries:0,ok:false,rev:false});if(act==='appchk'){a.v=$('#app-in').value;const n=parseAns(a.v);if(!isFinite(n))a.last='empty';else{a.tries++;const ok=Math.abs(n-C.a)<=(C.tol??Math.max(.011,Math.abs(C.a)*.004));a.ok=a.ok||ok;a.last=ok?'ok':'bad';}}else{if(!a.tries)return;a.rev=!a.rev;}save();stopPlayer();stopSim();const y=scrollY;render();scrollTo(0,y);}
 else if(act==='setPick'||act==='setNew'){const p=+b.dataset.p;S.set[p]=act==='setNew'?'R'+(1000+Math.floor(Math.random()*899000)):b.dataset.set;S.tm[p]={left:PAPERS[p].dur,run:false};rebuild();save();render();}
 else if(act==='clearP'){const p=+b.dataset.p;$('#clr-'+p).innerHTML=`<span class="confirm">${t('wipeQ').split('?')[0].replace(/,.*$/,'')}? <button class="btn sm sp" data-act="clearYes" data-p="${p}" type="button">${t('yes')}</button><button class="btn sm gh" data-act="clearNo" data-p="${p}" type="button">${t('no')}</button></span>`;}
 else if(act==='clearYes'){const p=+b.dataset.p;QS.filter(q=>q.p===p).forEach(q=>q.parts.forEach((x,i)=>delete S.ans[pid(q,i)]));Object.keys(S.choose).forEach(k=>{if(k.startsWith(S.set[p]+':'+p))delete S.choose[k];});save();render();}
 else if(act==='clearNo'){$('#clr-'+b.dataset.p).innerHTML='';}
 else if(act==='vplay'){if(player){if(player.t>=player.tot-.01){player.t=0;player.scene=-1;}player.play=!player.play;}}
 else if(act==='vscene'){if(player){const i=+b.dataset.i;player.t=player.V.sc.slice(0,i).reduce((n,x)=>n+x.d,0);player.scene=-1;player.play=true;}}
 else if(act==='anim'){simAnim=true;simT0=performance.now();}
 else if(act==='copy'){const txt=csvText(),box=$('#csvBox');try{navigator.clipboard.writeText(txt).then(()=>{$('#anMsg').textContent=t('copied');},()=>{box.hidden=false;box.value=txt;box.select();$('#anMsg').textContent=t('copyFail');});}catch(err){box.hidden=false;box.value=txt;box.select();$('#anMsg').textContent=t('copyFail');}}
 else if(act==='wipe'){$('#anMsg').innerHTML=`<span class="confirm">${t('wipeQ')} <button class="btn sm sp" data-act="wipeYes" type="button">${t('yes')}</button><button class="btn sm gh" data-act="wipeNo" type="button">${t('no')}</button></span>`;}
 else if(act==='wipeYes'){S.ans={};S.choose={};S.hist=[];S.tgt=null;S.tm={1:{left:7200,run:false},2:{left:9000,run:false}};save();render();}
 else if(act==='wipeNo'){$('#anMsg').innerHTML='';}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-act="choose"]');if(!c)return;const q=QS.find(x=>x.id===c.dataset.q),key=chKey(q.p,q.s),need=PAPERS[q.p].secs[q.s].need;let arr=S.choose[key]||[];
 if(c.checked){if(arr.length>=need){c.checked=false;const o=$('#out-'+q.p);if(o){o.innerHTML=`<div class="empty" style="border-color:var(--warn);color:var(--warn)">${t('chooseMax')(need)}</div>`;setTimeout(()=>{if(o.firstChild&&o.firstChild.classList?.contains('empty'))o.innerHTML='';},3500);}return;}arr.push(q.id);}else arr=arr.filter(x=>x!==q.id);
 S.choose[key]=arr;save();QS.filter(x=>x.p===q.p&&x.s===q.s).forEach(refreshQ);});
document.addEventListener('input',e=>{const k=e.target.dataset?.k;if(k){A(k).v=e.target.value;save();return;}const sv=e.target.dataset?.sv;if(sv){const n=+e.target.value;simV[curSim][sv]=n;const o=$('#so-'+sv);if(o)o.textContent=n;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='app-in'){e.preventDefault();document.querySelector('[data-act=appchk]').click();return;}if(e.key==='Enter'&&e.target.dataset?.k){e.preventDefault();check(e.target.dataset.k);}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)||!h){route();scrollTo({top:document.querySelector('.tabs').offsetTop,behavior:'instant'});}});

/* ---------- boot ---------- */
rebuild();(function(){let mv=false;Object.keys(S.ans).forEach(k=>{if(!k.includes('_')){S.ans['S1_'+k]=S.ans[k];delete S.ans[k];mv=true;}});Object.keys(S.choose).forEach(k=>{if(!k.includes(':')){S.choose['S1:'+k]=S.choose[k].slice();delete S.choose[k];mv=true;}});Object.keys(S.ans).forEach(k=>A(k));if(mv)save();})();
route();countdown();setInterval(countdown,1000);heroFx();tickTimer();
})();
